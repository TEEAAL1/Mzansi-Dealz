openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MzansiDealz API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: categories
    description: Category operations
  - name: cart
    description: Cart operations
  - name: checkout
    description: Checkout and order operations
  - name: admin
    description: Admin panel operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: on_sale
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, discount_desc]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured/flash sale products
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/new-arrivals:
    get:
      operationId: getNewArrivals
      tags: [products]
      summary: Get newest products
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: New arrivals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get product statistics summary
      responses:
        "200":
          description: Product stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Unauthorized

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderList"
        "401":
          description: Unauthorized

  /admin/orders/{orderNumber}/status:
    put:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /admin/payment-settings:
    get:
      operationId: getAdminPaymentSettings
      tags: [admin]
      summary: Get payment gateway settings and configuration status
      responses:
        "200":
          description: Payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentSettings"
        "401":
          description: Unauthorized
    put:
      operationId: updateAdminPaymentSettings
      tags: [admin]
      summary: Update payment gateway settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettingsInput"
      responses:
        "200":
          description: Updated payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentSettings"
        "400":
          description: Invalid settings
        "401":
          description: Unauthorized

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: List payment records
      responses:
        "200":
          description: Payment records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentList"
        "401":
          description: Unauthorized

  /admin/transactions:
    get:
      operationId: listAdminPaymentTransactions
      tags: [admin]
      summary: List payment transactions
      responses:
        "200":
          description: Payment transactions
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminPaymentTransaction"
        "401":
          description: Unauthorized

  /admin/payments/export.csv:
    get:
      operationId: exportAdminPayments
      tags: [admin]
      summary: Export payment records as CSV
      responses:
        "200":
          description: Payment CSV
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized

  /admin/payments/{id}/refund:
    post:
      operationId: refundAdminPayment
      tags: [admin]
      summary: Refund a payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: Refund created
        "400":
          description: Invalid refund
        "401":
          description: Unauthorized
        "409":
          description: Provider requires dashboard refund

  /admin/products:
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Unauthorized

  /admin/product-import/latest:
    get:
      operationId: getLatestProductImport
      tags: [admin]
      summary: Get the latest PerfectDealz product migration run
      responses:
        "200":
          description: Latest import run and preview items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportStatusResponse"
        "401":
          description: Unauthorized

  /admin/product-import/start:
    post:
      operationId: startProductImport
      tags: [admin]
      summary: Crawl the authorized PerfectDealz product catalog
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImportOptions"
      responses:
        "202":
          description: Crawl started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportStartResponse"
        "401":
          description: Unauthorized

  /admin/product-import/{id}:
    get:
      operationId: getProductImport
      tags: [admin]
      summary: Get product migration status and preview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import run and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportStatusResponse"
        "404":
          description: Import not found
        "401":
          description: Unauthorized

  /admin/product-import/{id}/import:
    post:
      operationId: importProductRun
      tags: [admin]
      summary: Import the previewed product migration CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Import started
        "409":
          description: Run is not ready
        "401":
          description: Unauthorized

  /admin/product-import/{id}/rollback:
    post:
      operationId: rollbackProductImport
      tags: [admin]
      summary: Roll back an imported product migration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import rolled back
        "409":
          description: Run cannot be rolled back
        "401":
          description: Unauthorized

  /admin/product-import/{id}/csv:
    get:
      operationId: downloadProductImportCsv
      tags: [admin]
      summary: Download the product migration CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product migration CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Import not found
        "401":
          description: Unauthorized

  /admin/categories:
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "409":
          description: Duplicate category

  /admin/products/{id}:
    put:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
        "401":
          description: Unauthorized

    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /admin/categories/{id}:
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid category id
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Category contains products

  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Create an order and get hosted payment redirect data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Order created with hosted payment redirect data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Validation error

  /checkout/options:
    get:
      operationId: getCheckoutOptions
      tags: [checkout]
      summary: List available hosted payment gateways
      responses:
        "200":
          description: Available payment gateways
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOptions"

  /checkout/notify:
    post:
      operationId: handlePayfastNotify
      tags: [checkout]
      summary: PayFast ITN webhook
      responses:
        "200":
          description: OK

  /checkout/retry/{orderNumber}:
    post:
      operationId: retryCheckout
      tags: [checkout]
      summary: Retry payment for an unpaid order
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryCheckoutInput"
      responses:
        "200":
          description: Hosted payment redirect data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: Invalid retry request
        "404":
          description: Order not found

  /webhooks/yoco:
    post:
      operationId: handleYocoWebhook
      tags: [checkout]
      summary: Yoco payment webhook
      responses:
        "200":
          description: Webhook received

  /orders/{orderNumber}/invoice:
    get:
      operationId: downloadInvoice
      tags: [checkout]
      summary: Download an order invoice
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Invoice HTML file
          content:
            text/html:
              schema:
                type: string

  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [checkout]
      summary: Get order by order number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Product:
      type: object
      required:
        - id
        - name
        - slug
        - price
        - originalPrice
        - discountPercent
        - categoryId
        - categoryName
        - imageUrl
        - inStock
        - isFeatured
        - isNewArrival
        - onSale
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        originalPrice:
          type: number
        discountPercent:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
        imageUrl:
          type: string
        inStock:
          type: boolean
        stockCount:
          type: ["integer", "null"]
        isFeatured:
          type: boolean
        isNewArrival:
          type: boolean
        onSale:
          type: boolean
        tags:
          type: ["string", "null"]
        categorySlug:
          type: string
        sku:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        specifications:
          type: ["string", "null"]
        features:
          type: ["string", "null"]
        galleryImages:
          type: ["string", "null"]
        stockStatus:
          type: ["string", "null"]
        weight:
          type: ["string", "null"]
        dimensions:
          type: ["string", "null"]
        variants:
          type: ["string", "null"]
        metaTitle:
          type: ["string", "null"]
        metaDescription:
          type: ["string", "null"]
        searchKeywords:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    ProductList:
      type: object
      required:
        - products
        - total
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer

    Category:
      type: object
      required:
        - id
        - name
        - slug
        - icon
        - productCount
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        productCount:
          type: integer
        description:
          type: ["string", "null"]

    ProductStats:
      type: object
      required:
        - totalProducts
        - totalCategories
        - avgDiscountPercent
        - featuredCount
        - newArrivalsCount
      properties:
        totalProducts:
          type: integer
        totalCategories:
          type: integer
        avgDiscountPercent:
          type: integer
        featuredCount:
          type: integer
        newArrivalsCount:
          type: integer

    AdminLoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminLoginResponse:
      type: object
      required: [authenticated, csrfToken]
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type: string

    AdminStats:
      type: object
      required:
        - totalOrders
        - ordersToday
        - totalRevenue
        - revenueToday
        - totalProducts
        - pendingOrders
      properties:
        totalOrders:
          type: integer
        ordersToday:
          type: integer
        totalRevenue:
          type: number
        revenueToday:
          type: number
        totalProducts:
          type: integer
        pendingOrders:
          type: integer

    AdminOrder:
      type: object
      required:
        - id
        - orderNumber
        - customerName
        - customerEmail
        - total
        - status
        - itemCount
        - createdAt
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        total:
          type: number
        status:
          type: string
        itemCount:
          type: integer
        createdAt:
          type: string

    AdminOrderList:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        total:
          type: integer

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, awaiting_payment, paid, processing, packed, shipped, delivered, cancelled, refunded, failed]

    PaymentSettingsInput:
      type: object
      required: [currency, defaultGateway, yocoEnabled, payfastEnabled, payfastSandbox]
      properties:
        currency:
          type: string
          enum: [ZAR]
        defaultGateway:
          type: string
          enum: [yoco, payfast]
        yocoEnabled:
          type: boolean
        payfastEnabled:
          type: boolean
        payfastSandbox:
          type: boolean

    AdminPaymentSettings:
      allOf:
        - $ref: "#/components/schemas/PaymentSettingsInput"
        - type: object
          required: [id, yocoConfigured, yocoWebhookConfigured, payfastConfigured, emailConfigured, updatedAt]
          properties:
            id:
              type: integer
            yocoConfigured:
              type: boolean
            yocoWebhookConfigured:
              type: boolean
            payfastConfigured:
              type: boolean
            emailConfigured:
              type: boolean
            updatedAt:
              type: string
              format: date-time

    AdminPayment:
      type: object
      required: [id, orderId, gateway, status, reference, amount, currency, customerEmail, createdAt, updatedAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        gateway:
          type: string
        status:
          type: string
        providerPaymentId:
          type: ["string", "null"]
        providerCheckoutId:
          type: ["string", "null"]
        reference:
          type: string
        amount:
          type: string
        currency:
          type: string
        customerEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPaymentList:
      type: object
      required: [payments]
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/AdminPayment"

    AdminPaymentTransaction:
      type: object
      required: [id, paymentId, gateway, type, status, createdAt]
      properties:
        id:
          type: integer
        paymentId:
          type: integer
        gateway:
          type: string
        type:
          type: string
        status:
          type: string
        providerReference:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - originalPrice
        - categoryId
        - imageUrl
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        categoryId:
          type: integer
        imageUrl:
          type: string
        inStock:
          type: boolean
        stockCount:
          type: integer
        isFeatured:
          type: boolean
        isNewArrival:
          type: boolean
        onSale:
          type: boolean
        tags:
          type: string

    ProductImportOptions:
      type: object
      properties:
        overwriteExisting:
          type: boolean
        skipExisting:
          type: boolean
        importImages:
          type: boolean

    ProductImportRun:
      type: object
      required: [id, sourceDomain, status, totalDiscovered, productsImported, productsFailed, missingImages, missingPrices, overwriteExisting, skipExisting, importImages, createdAt]
      properties:
        id:
          type: integer
        sourceDomain:
          type: string
        status:
          type: string
        totalDiscovered:
          type: integer
        productsImported:
          type: integer
        productsFailed:
          type: integer
        missingImages:
          type: integer
        missingPrices:
          type: integer
        overwriteExisting:
          type: boolean
        skipExisting:
          type: boolean
        importImages:
          type: boolean
        csvPath:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]

    ProductImportItem:
      type: object
      required: [id, sourceUrl, status, missingImage, missingPrice]
      properties:
        id:
          type: integer
        sourceUrl:
          type: string
        sku:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        status:
          type: string
        error:
          type: ["string", "null"]
        missingImage:
          type: boolean
        missingPrice:
          type: boolean

    ProductImportStatusResponse:
      type: object
      required: [run, items]
      properties:
        run:
          anyOf:
            - $ref: "#/components/schemas/ProductImportRun"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductImportItem"

    ProductImportStartResponse:
      type: object
      required: [run, message]
      properties:
        run:
          $ref: "#/components/schemas/ProductImportRun"
        message:
          type: string

    CreateCategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        description:
          type: string

    CheckoutItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
        quantity:
          type: integer

    CheckoutRequest:
      type: object
      required:
        - items
        - customerName
        - customerEmail
        - customerPhone
        - deliveryAddress
        - deliveryCity
        - deliveryProvince
        - deliveryPostalCode
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutItem"
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        deliveryAddress:
          type: string
        deliveryCity:
          type: string
        deliveryProvince:
          type: string
        deliveryPostalCode:
          type: string
        gateway:
          type: string
          enum: [yoco, payfast]
        idempotencyKey:
          type: string
          minLength: 8

    CheckoutResponse:
      type: object
      required:
        - orderNumber
        - total
        - gateway
        - paymentReference
        - redirectUrl
      properties:
        orderNumber:
          type: string
        total:
          type: number
        gateway:
          type: string
        paymentReference:
          type: string
        redirectUrl:
          type: string
        yocoCheckoutId:
          type: ["string", "null"]
        payfastUrl:
          type: ["string", "null"]
        payfastData:
          type: object
          nullable: true
          additionalProperties:
            type: string

    CheckoutOptions:
      type: object
      required: [currency, defaultGateway, gateways]
      properties:
        currency:
          type: string
          enum: [ZAR]
        defaultGateway:
          type: string
          nullable: true
          enum: [yoco, payfast, null]
        gateways:
          type: array
          items:
            type: object
            required: [id, name, available, description, methods]
            properties:
              id:
                type: string
                enum: [yoco, payfast]
              name:
                type: string
              available:
                type: boolean
              description:
                type: string
              methods:
                type: array
                items:
                  type: string

    RetryCheckoutInput:
      type: object
      required: [customerEmail]
      properties:
        customerEmail:
          type: string
          format: email
        gateway:
          type: string
          enum: [yoco, payfast]

    OrderItem:
      type: object
      required:
        - id
        - productId
        - productName
        - productImageUrl
        - price
        - quantity
        - subtotal
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        productImageUrl:
          type: string
        price:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number

    OrderDetail:
      type: object
      required:
        - id
        - orderNumber
        - customerName
        - customerEmail
        - customerPhone
        - deliveryAddress
        - deliveryCity
        - deliveryProvince
        - deliveryPostalCode
        - subtotal
        - deliveryFee
        - total
        - status
        - items
        - createdAt
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        deliveryAddress:
          type: string
        deliveryCity:
          type: string
        deliveryProvince:
          type: string
        deliveryPostalCode:
          type: string
        subtotal:
          type: number
        deliveryFee:
          type: number
        total:
          type: number
        status:
          type: string
        payfastPaymentId:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
